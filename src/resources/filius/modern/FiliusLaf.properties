# Filius (RBZ Wirtschaft Kiel Version) – FlatLaf theme
# Palette: patch blue (design), link-LED green (simulation), marker amber (documentation)

@accentColor = #2E6BD8
@foreground = #1C2B3A
@disabledForeground = #A3AFBB
@background = #FFFFFF
@componentBackground = #FFFFFF
@selectionBackground = #2E6BD8
@selectionInactiveBackground = #D9E4F7
@selectionInactiveForeground = #1C2B3A

#---- general ----
Component.arc = 10
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.borderColor = #D3DBE3
Component.disabledBorderColor = #E3E8ED
Component.focusedBorderColor = #2E6BD8
Component.focusColor = #2E6BD840
Panel.background = #FFFFFF

#---- buttons ----
Button.arc = 10
Button.margin = 4,14,4,14
Button.borderColor = #D3DBE3
Button.hoverBackground = #F1F5FA
Button.pressedBackground = #E4EBF3
Button.default.background = #2E6BD8
Button.default.foreground = #FFFFFF
Button.default.borderColor = #2E6BD8
Button.default.hoverBackground = #2860C4
Button.default.pressedBackground = #2254AD
Button.default.focusedBorderColor = #1E4EA6
Button.default.focusedBackground = #2860C4
Button.default.borderWidth = 1
Button.default.boldText = true
ToggleButton.selectedBackground = #DCE7FA
ToggleButton.selectedForeground = #1C2B3A

#---- text ----
TextComponent.arc = 8
TextField.margin = 3,7,3,7
PasswordField.margin = 3,7,3,7
FormattedTextField.margin = 3,7,3,7
TextField.placeholderForeground = #9AA6B2
TextArea.background = #FFFFFF
EditorPane.background = #FFFFFF
TextPane.background = #FFFFFF

#---- check boxes / radio buttons ----
CheckBox.icon.style = filled
CheckBox.arc = 5
CheckBox.icon.checkmarkColor = #FFFFFF
CheckBox.icon.selectedBackground = #2E6BD8
CheckBox.icon.selectedBorderColor = #2E6BD8
# checked but disabled (e.g. IP forwarding of a router): grey tick, not white on grey
CheckBox.icon.disabledCheckmarkColor = #8796A5

#---- combo box / spinner ----
ComboBox.buttonStyle = mac-style
ComboBox.selectionArc = 6
ComboBox.padding = 3,7,3,7
ComboBox.popupInsets = 4,4,4,4
ComboBox.buttonArrowColor = #4A5B6C
Spinner.buttonStyle = mac-style

#---- lists, tables, trees ----
List.selectionArc = 6
Tree.selectionArc = 6
Tree.showDefaultIcons = false
Table.rowHeight = 24
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.gridColor = #EDF1F5
Table.intercellSpacing = 0,1
Table.selectionInactiveBackground = #E3ECFA
Table.alternateRowColor = #FAFBFC
TableHeader.background = #F4F7FA
TableHeader.foreground = #4A5B6C
TableHeader.separatorColor = #E3E8ED
TableHeader.bottomSeparatorColor = #D3DBE3
TableHeader.height = 26

#---- scroll bars ----
ScrollBar.width = 12
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.track = #00000000
ScrollBar.thumb = #C5CFD9
ScrollBar.hoverThumbColor = #A9B5C2
ScrollBar.pressedThumbColor = #8D9BAA
ScrollBar.showButtons = false
ScrollPane.smoothScrolling = true
ScrollPane.borderColor = #E3E8ED

#---- tabs ----
TabbedPane.tabArc = 8
TabbedPane.tabSelectionArc = 8
TabbedPane.cardTabArc = 8
TabbedPane.selectedBackground = #FFFFFF
TabbedPane.underlineColor = #2E6BD8
TabbedPane.inactiveUnderlineColor = #9AA6B2
TabbedPane.tabHeight = 30
TabbedPane.showTabSeparators = false
TabbedPane.hoverColor = #F1F5FA

#---- menus / popups ----
PopupMenu.borderCornerRadius = 10
PopupMenu.borderInsets = 6,1,6,1
MenuItem.selectionArc = 6
MenuItem.selectionInsets = 0,4,0,4
MenuItem.selectionBackground = #E8EFFB
MenuItem.selectionForeground = #1C2B3A
Popup.borderCornerRadius = 10

#---- tooltips: dark, like a label on a patch panel ----
ToolTip.background = #1C2B3A
ToolTip.foreground = #FFFFFF
ToolTip.border = 6,10,6,10,#1C2B3A

#---- dialogs / windows ----
TitlePane.unifiedBackground = true
TitlePane.background = #FFFFFF
TitlePane.inactiveBackground = #FFFFFF
TitlePane.foreground = #1C2B3A
TitlePane.buttonHoverBackground = #EEF2F6
OptionPane.buttonMinimumWidth = 90
OptionPane.messageFont = +1

#---- slider (simulation speed) ----
Slider.trackWidth = 4
Slider.thumbSize = 14,14
Slider.trackColor = #DDE4EB
Slider.trackValueColor = #2E6BD8
Slider.thumbColor = #2E6BD8
Slider.focusedColor = #2E6BD833
Slider.hoverThumbColor = #2860C4

#---- progress ----
ProgressBar.arc = 999
ProgressBar.foreground = #13A35A

#---- separators ----
Separator.foreground = #E3E8ED
Separator.stripeWidth = 1

# Filius (RBZ Wirtschaft Kiel Version) – FlatLaf theme, dark mode
# Deep slate surfaces, the same patch cable accents (a little brighter)

@accentColor = #4C8DF6
@foreground = #E6EDF4
@disabledForeground = #8091A3
@background = #17212C
@componentBackground = #1C2835
@selectionBackground = #2F6FE0
@selectionForeground = #FFFFFF
@selectionInactiveBackground = #2A3B52
@selectionInactiveForeground = #E6EDF4

#---- general ----
Component.arc = 10
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.borderColor = #33475B
Component.disabledBorderColor = #26333F
Component.focusedBorderColor = #4C8DF6
Component.focusColor = #4C8DF640
Panel.background = #17212C

#---- buttons ----
Button.arc = 10
Button.margin = 4,14,4,14
Button.background = #223040
Button.borderColor = #33475B
Button.hoverBackground = #2A3A4C
Button.pressedBackground = #314459
Button.default.background = #2F6FE0
Button.default.foreground = #FFFFFF
Button.default.borderColor = #2F6FE0
Button.default.hoverBackground = #3A7BEB
Button.default.pressedBackground = #2862CC
Button.default.focusedBorderColor = #6FA4FA
Button.default.focusedBackground = #3A7BEB
Button.default.borderWidth = 1
Button.default.boldText = true
ToggleButton.selectedBackground = #2A3F5E
ToggleButton.selectedForeground = #E6EDF4

#---- text ----
TextComponent.arc = 8
TextField.margin = 3,7,3,7
PasswordField.margin = 3,7,3,7
FormattedTextField.margin = 3,7,3,7
TextField.placeholderForeground = #6D7E90
TextField.background = #1C2835
TextArea.background = #1C2835
EditorPane.background = #1C2835
TextPane.background = #1C2835
FormattedTextField.background = #1C2835
PasswordField.background = #1C2835

#---- check boxes / radio buttons ----
CheckBox.icon.style = filled
CheckBox.arc = 5
CheckBox.icon.checkmarkColor = #FFFFFF
CheckBox.icon.selectedBackground = #4C8DF6
CheckBox.icon.selectedBorderColor = #4C8DF6
# the dark FlatLaf fills checked boxes with the tick colour: use the blue accent like in the light mode
CheckBox.icon[filled].selectedBackground = #4C8DF6
CheckBox.icon[filled].selectedBorderColor = #4C8DF6
CheckBox.icon[filled].checkmarkColor = #FFFFFF
CheckBox.icon[filled].focusedSelectedBackground = #4C8DF6
CheckBox.icon[filled].focusedCheckmarkColor = #FFFFFF
CheckBox.icon[filled].hoverSelectedBackground = #5E9BFF
CheckBox.icon[filled].pressedSelectedBackground = #3D7CE0
CheckBox.icon.disabledCheckmarkColor = #8091A3

#---- combo box / spinner ----
ComboBox.buttonStyle = mac-style
ComboBox.selectionArc = 6
ComboBox.padding = 3,7,3,7
ComboBox.popupInsets = 4,4,4,4
ComboBox.buttonArrowColor = #ADBCCB
ComboBox.background = #1C2835
Spinner.buttonStyle = mac-style

#---- lists, tables, trees ----
List.background = #1C2835
List.selectionArc = 6
Tree.background = #1C2835
Tree.selectionArc = 6
Tree.showDefaultIcons = false
Table.background = #1C2835
Table.rowHeight = 24
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.gridColor = #26333F
Table.intercellSpacing = 0,1
Table.selectionInactiveBackground = #2A3B52
Table.alternateRowColor = #1F2C39
TableHeader.background = #1F2B38
TableHeader.foreground = #ADBCCB
TableHeader.separatorColor = #2D3B4A
TableHeader.bottomSeparatorColor = #33475B
TableHeader.height = 26

#---- scroll bars ----
ScrollBar.width = 12
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.track = #00000000
ScrollBar.thumb = #3A4C60
ScrollBar.hoverThumbColor = #4A5E74
ScrollBar.pressedThumbColor = #5B7088
ScrollBar.showButtons = false
ScrollPane.smoothScrolling = true
ScrollPane.borderColor = #2D3B4A

#---- tabs ----
TabbedPane.tabArc = 8
TabbedPane.tabSelectionArc = 8
TabbedPane.cardTabArc = 8
TabbedPane.selectedBackground = #1C2835
TabbedPane.underlineColor = #4C8DF6
TabbedPane.inactiveUnderlineColor = #6D7E90
TabbedPane.tabHeight = 30
TabbedPane.showTabSeparators = false
TabbedPane.hoverColor = #223040

#---- menus / popups ----
PopupMenu.borderCornerRadius = 10
PopupMenu.borderInsets = 6,1,6,1
PopupMenu.background = #1C2835
MenuItem.selectionArc = 6
MenuItem.selectionInsets = 0,4,0,4
MenuItem.selectionBackground = #2A3B52
MenuItem.selectionForeground = #FFFFFF
Popup.borderCornerRadius = 10

#---- tooltips: light label on the dark surface ----
ToolTip.background = #E6EDF4
ToolTip.foreground = #17212C
ToolTip.border = 6,10,6,10,#E6EDF4

#---- dialogs / windows ----
TitlePane.unifiedBackground = true
TitlePane.background = #17212C
TitlePane.inactiveBackground = #17212C
TitlePane.foreground = #E6EDF4
TitlePane.buttonHoverBackground = #223040
OptionPane.buttonMinimumWidth = 90
OptionPane.messageFont = +1

#---- slider (simulation speed) ----
Slider.trackWidth = 4
Slider.thumbSize = 14,14
Slider.trackColor = #2D3B4A
Slider.trackValueColor = #4C8DF6
Slider.thumbColor = #4C8DF6
Slider.focusedColor = #4C8DF633
Slider.hoverThumbColor = #6FA4FA

#---- progress ----
ProgressBar.arc = 999
ProgressBar.foreground = #26BD6C

#---- separators ----
Separator.foreground = #2D3B4A
Separator.stripeWidth = 1

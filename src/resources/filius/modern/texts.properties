tls.mean.ClientHello = Handshake 1: Der Browser grüßt den Server und nennt die Verfahren, die er kann. Noch ist nichts verschlüsselt.
tls.mean.ServerHello = Handshake 2: Der Server schickt sein Zertifikat mit seinem öffentlichen Schlüssel – dem offenen Vorhängeschloss.
tls.mean.ClientKeyExchange = Handshake 3: Der Browser schickt den Sitzungsschlüssel, verschlossen mit dem öffentlichen Schlüssel des Servers (asymmetrisch). Öffnen kann ihn nur der Server mit seinem privaten Schlüssel.
tls.mean.Finished = Handshake 4: Der Server bestätigt mit dem Sitzungsschlüssel. Ab jetzt verschlüsseln beide mit demselben Schlüssel (symmetrisch).
tls.mean.data = Verschlüsselte Daten der Anwendung (hier HTTP), verschlossen mit dem gemeinsamen Sitzungsschlüssel (symmetrisch).

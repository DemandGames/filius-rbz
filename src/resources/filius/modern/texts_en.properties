tls.mean.ClientHello = Handshake 1: the browser greets the server and names the methods it knows. Nothing is encrypted yet.
tls.mean.ServerHello = Handshake 2: the server sends its certificate with its public key – the open padlock.
tls.mean.ClientKeyExchange = Handshake 3: the browser sends the session key, locked with the public key of the server (asymmetric). Only the server can open it with its private key.
tls.mean.Finished = Handshake 4: the server confirms with the session key. From now on both encrypt with the same key (symmetric).
tls.mean.data = Encrypted data of the application (here HTTP), locked with the shared session key (symmetric).
tls.mean.Alert = Warning: the connection is closed.
